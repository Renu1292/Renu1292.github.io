<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hola!</title>
    <!----- Google Font ------->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!----- Bootstrap --------->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!------ Custom Styles ----->
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        :root {
            --accent: #22d3ee;
            --primary-dark: #0d1117;
            --text-light: #e6edf3;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* CONTACT SECTION */
        #contact {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 100px 20px;
            background: radial-gradient(circle at 20% 30%, rgba(34,211,238,0.08), transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(34,211,238,0.06), transparent 60%);
            position: relative;
            overflow: hidden;
        }

        /* Floating glow orbs for animation */
        #contact::before, #contact::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34,211,238,0.3), transparent 70%);
            animation: floatGlow 10s ease-in-out infinite alternate;
            z-index: 0;
        }

        #contact::before { top: 10%; left: 15%; }
        #contact::after { bottom: 15%; right: 10%; animation-delay: 5s; }

        @keyframes floatGlow {
            0% { transform: translateY(0); opacity: 0.6; }
            100% { transform: translateY(-40px); opacity: 1; }
        }

        .contact-container {
            position: relative;
            z-index: 1;
            max-width: 650px;
            margin: 0 auto;
            text-align: center;
        }

        .contact-title {
            font-size: 2.2rem;
            color: var(--accent);
            text-shadow: 0 0 12px rgba(34,211,238,0.5);
            margin-bottom: 15px;
        }

        .contact-subtitle {
            color:  #9ca3af;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .contact-form {
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(34,211,238,0.3);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(34,211,238,0.15);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .contact-form:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 60px rgba(34,211,238,0.25);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-label {
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 600;
        }

        .form-control-custom {
            width: 100%;
            background: #0d1117;
            border: 1px solid rgba(34,211,238,0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #e6edf3;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(34,211,238,0.4);
        }
        .textarea {
            min-height: 130px;
            resize: vertical;
        }

        .btn-primary-glow {
            background: linear-gradient(90deg, #06b6d4, #22d3ee);
            border: none;
            color: white;
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(34,211,238,0.3);
            transition: all 0.3s ease;
        }

        .btn-primary-glow:hover {
            box-shadow: 0 0 30px rgba(34,211,238,0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <section id="contact">
        <div class="contact-container">
            <h2 class="contact-title">Let's Connect</h2>
            <p class="contact-subtitle">
                Have an idea, project, or question? Drop me a message below.
            </p>

            <!---- FORMSPREE FORM ------->
            <form action= "https://formspree.io/f/xojvgkpw" method="POST" class="contact-form mx-auto" id="contactForm">
                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name" class="form-control-custom" placeholder="Your Name" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control-custom" placeholder="Your Email" required>
                </div>

                 <div class="form-group">
                    <label for="message" class="form-label">Message</label>
                     <textarea id="message" name="message" class="form-control-custom textarea" placeholder="Your Message" required></textarea>
                 </div>

                 <button type="submit" class="btn btn-primary-glow mt-3">
                    Send Message
                 </button>

                <!--- Hidden honeypot field to prevent spam --->
                <input type="text" name="_gotcha" style="display:none">
            </form>

            <!--- Success Message --->
            <div class="alert alert-success mt-3" id="successMessage" style="display: none;">
                Thank you! Your message has been sent.
            </div>

            <!--- Back to Home link --->
            <div style="text-align: center; margin-top: 30px;">
                <a href="#" style="color:var(--accent); text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Back to Portfolio
                </a>
            </div>
        </div>
    </section>

    <!--- Font Awesome for Icons --->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <!--- Form submission handling --->
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            const submitButton = form.querySelector('button[type="submit"]');
            const originalText = submitButton.innerHTML;


            // Show loading state
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            submitButton.disabled = true;

            try {
                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Show success message
                    document.getElementById('successMessage').style.display = 'block';
                    form.reset();

                    // Reset button after 3 seconds
                    setTimeout(() => {
                        submitButton.innerHTML = originalText;
                        submitButton.disabled = false;
                        document.getElementById('successMessage').style.display = 'none';
                    }, 3000);
                } else {
                    alert('Oops! There was a problem. Please try again.');
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                }
            } catch (error) {
                    alert('Oops! There was a problem. Please try again.');
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
